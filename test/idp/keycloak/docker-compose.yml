# Keycloak IdP (standalone stack). Fronted by the shared proxy at
# https://keycloak.test:9443. Bring up with: ../up.sh  (or docker compose up -d)
name: keycloak

networks:
  default:
    name: os-sso-idp
    external: true

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: https://keycloak.test:9443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Trust the lab CA for outgoing calls: the firewall's WebGUI certificate is issued
      # by it (test/vagrant/deploy.sh), so back-channel logout tokens and a request_uri
      # fetched from the firewall go over verified HTTPS.
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores/os-sso-lab-ca.crt
    volumes:
      - ../certs/ca.crt:/opt/keycloak/conf/truststores/os-sso-lab-ca.crt:ro
    ports:
      # Host convenience only (kcadm runs through docker exec, and the proxy reaches
      # the container over the shared network). Overridable: 8081 is a popular port.
      - "0.0.0.0:${KC_HTTP_PORT:-8081}:8080"
