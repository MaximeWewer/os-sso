#
# Generated by os-sso -- do not edit, changes are overwritten.
# Read by auth-user-pass-verify.sh on every OpenVPN connection attempt.
#
# One block per web-auth profile. An OpenVPN server names its profile as the script's
# first argument; a server that names none gets DEFAULT_PROFILE, the first enabled one,
# which is what every configuration written before profiles existed did.
#
{% set enabled_profiles = [] %}
{% if helpers.exists('OPNsense.SSO.settings.vpn.profiles.profile') %}
{%   for uuid, profile in OPNsense.SSO.settings.vpn.profiles.profile.iteritems() %}
{%     if profile.enabled == '1' %}
{%       set _ = enabled_profiles.append(profile) %}
# --- {{ profile.name }} ---
# Quoted because the verify script sources this file and an authentication server
# name may contain spaces ("Local Database" and friends). A single quote of its own
# would end that quoting and turn the rest of the name into shell, so it is dropped
# here as well -- core's own name validation refuses one today, and this file is not
# the place to depend on that staying true.
PROFILE_{{ profile.name }}_PROTOCOL='{{ profile.protocol }}'
PROFILE_{{ profile.name }}_PROVIDER='{{ profile.provider|replace("'", "") }}'
# The same name, percent-encoded, for the provider= query parameter of the WEB_AUTH
# URL handed to the client. A space or an "&" in the name would otherwise truncate
# the URL or inject a parameter.
PROFILE_{{ profile.name }}_PROVIDER_ENC='{{ profile.provider|urlencode }}'
PROFILE_{{ profile.name }}_HOST='{{ profile.host }}'
PROFILE_{{ profile.name }}_TIMEOUT='{{ profile.timeout }}'
PROFILE_{{ profile.name }}_ENFORCE_USERNAME='{{ profile.enforce_username }}'
{%     endif %}
{%   endfor %}
{% endif %}
{% if enabled_profiles %}
DEFAULT_PROFILE='{{ enabled_profiles[0].name }}'
{% else %}
# No enabled OpenVPN web-auth profile (System > Access > SSO VPN web-auth). With no
# profile to resolve, the verify script refuses the connection rather than deferring it.
DEFAULT_PROFILE=''
{% endif %}
