#
# Generated by os-sso -- do not edit, changes are overwritten.
# Read by auth-user-pass-verify.sh on every OpenVPN connection attempt.
#
{% if helpers.exists('OPNsense.SSO.settings.vpn') and OPNsense.SSO.settings.vpn.enabled == '1' %}
# Quoted because the verify script sources this file and an authentication server
# name may contain spaces ("Local Database" and friends).
PROTOCOL='{{ OPNsense.SSO.settings.vpn.protocol }}'
PROVIDER='{{ OPNsense.SSO.settings.vpn.provider }}'
# The same name, percent-encoded, for the provider= query parameter of the WEB_AUTH
# URL handed to the client. A space or an "&" in the name would otherwise truncate
# the URL or inject a parameter.
PROVIDER_ENC='{{ OPNsense.SSO.settings.vpn.provider|urlencode }}'
HOST='{{ OPNsense.SSO.settings.vpn.host }}'
TIMEOUT='{{ OPNsense.SSO.settings.vpn.timeout }}'
ENFORCE_USERNAME='{{ OPNsense.SSO.settings.vpn.enforce_username }}'
{% else %}
# OpenVPN web-auth is disabled (System > Access > SSO Settings). With PROVIDER and
# HOST unset the verify script refuses the connection rather than deferring it.
{% endif %}
