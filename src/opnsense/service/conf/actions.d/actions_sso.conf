[vpn_verdict]
command:/usr/local/opnsense/scripts/OPNsense/SSO/vpn_verdict.sh
parameters:%s %s %s %s
type:script_output
message:os-sso writing OpenVPN deferred-auth verdict
description:Write OpenVPN deferred-auth verdict (root)

; Disconnects the OpenVPN tunnels of one common name, so a revocation (back-channel
; logout, SCIM deactivation, an administrator ending a session) reaches the VPN too.
[vpn_kill]
command:/usr/local/opnsense/scripts/OPNsense/SSO/vpn_kill.py
parameters:%s
type:script_output
message:os-sso disconnecting the OpenVPN tunnels of %s
description:Disconnect an OpenVPN common name (root)

; Packages the SSO captive-portal login page as a zip ready to upload under
; Services > Captive Portal > Administration > Templates.
[build_cp_template]
command:/usr/local/opnsense/scripts/OPNsense/SSO/build_cp_template.sh
parameters:
type:script_output
message:os-sso building the captive portal template
description:os-sso: build the captive portal template

; Schedulable from System > Settings > Cron: ends SSO sessions that reached the
; provider's maximum session lifetime (the WebGUI's own timeout is idle-only).
[expire_sessions]
command:/usr/local/opnsense/scripts/OPNsense/SSO/expire_sessions.php
parameters:
type:script_output
message:os-sso expiring SSO sessions
description:os-sso: expire SSO sessions
