[vpn_verdict]
command:/usr/local/opnsense/scripts/OPNsense/SSO/vpn_verdict.sh
parameters:%s %s %s
type:script_output
message:os-sso writing OpenVPN deferred-auth verdict
description:Write OpenVPN deferred-auth verdict (root)

; Schedulable from System > Settings > Cron: ends SSO sessions that reached the
; provider's maximum session lifetime (the WebGUI's own timeout is idle-only).
[expire_sessions]
command:/usr/local/opnsense/scripts/OPNsense/SSO/expire_sessions.php
parameters:
type:script_output
message:os-sso expiring SSO sessions
description:os-sso: expire SSO sessions
