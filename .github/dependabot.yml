version: 2

updates:
  # Actions are pinned to commit SHAs, which nothing else bumps. Dependabot updates the
  # SHA and its version comment together. Composer dependencies are left out on purpose:
  # update-versions.yml already keeps composer.json and composer.lock current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
