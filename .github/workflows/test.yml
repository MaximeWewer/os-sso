name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: PHP 8.3 unit and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.3"
          extensions: curl, dom, gettext, mbstring, openssl, simplexml, xml
          coverage: none

      - name: Validate and install locked dependencies
        working-directory: src/opnsense/mvc/app/library/OPNsense/SSO
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-interaction
          composer install --no-dev --no-interaction --classmap-authoritative \
            --no-scripts --no-plugins

      - name: Check PHP syntax
        run: find src test -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit suite without skipped state tests
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /var/db/os-sso
          php test/unit/run.php
